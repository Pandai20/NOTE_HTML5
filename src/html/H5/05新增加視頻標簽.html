<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05新增加視頻標簽</title>
    <style>
        video {
            width: 600px;
            height: auto;
        }
    </style>
</head>
<body>
    <!-- 當我們設置寬高的時候 一般單獨設置寬  或者高，不同時設置
    controls :提供視頻播放頁面的選項
    muted 靜音 + autoplay  能制動播放靜音視頻
    媒體產於度：chrome://media-engagement/   網頁經常播放就會自動了 
    loop: 循環播放
    preload : auto(自動加載) matadata(視頻的元數據 時常) none(不加載)
    poster :設置視頻的封面(圖片地址)
    -->
    <video src="視頻地址" controls ></video>

    <!-- 音頻
    controls：提供播放頁面的各種選項
    autoplay: 媒體產於度比較高的話就行
    loop: 循環播放
    preload: 預加載
    -->
    <audio src="" controls></audio>
</body>
</html>
