<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#">
        <input type="text" name="" id=""  list="data">
        <button>搜索</button>
    </form>
    <!-- datalist ：用於搜索框的關鍵提示
     不同的瀏覽器顯示的不一樣 -->
    <datalist id="data">
        <option value="周傑倫">周傑倫</option>
        <option value="周冬雨">周冬雨</option>
        <option value="馬冬梅">馬冬梅</option>
        <option value="溫兆倫">溫兆倫</option>
    </datalist>
    <br>
    <hr>

    <!-- 用於展示問題和答案，或對專有名詞進行解釋 -->
    <details>
        <!-- summary 摘要：寫在details的裏面用於指定問題或專有名詞 -->
        <summary>如何一夜暴富？</summary>
        <p>購買彩票</p>
    </details>
</body>
</html>
