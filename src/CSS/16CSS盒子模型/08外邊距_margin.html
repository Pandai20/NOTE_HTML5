<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08外邊距_margin</title>
    <style>

        div {
            font-size: 20px;
            background-color: skyblue;
            width: 400px;
            height: 400px;

            margin-left: 20px;
            margin-right: 40px;
            margin-top: 20px;
            margin-bottom: 20px;


            /* 複合屬性 */
            margin: 30px;
            /* 上下\左右 */
            margin: 30px 40px;
            /* 上\左右\下 */
            margin: 30px 40px 50px;
            /* 上\右\下\左 順時針*/
            margin:10px 20px 30px 40px;
        }
    </style>
</head>
<body>
    <div>我是大前端</div>
</body>
</html>
