<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03盒子模型的組成部分</title>
    <style>
        div {
            /* 内容區的寬 */
            width: 400px;
            /* 内容區的高 */
            height: 400px;
            font-size: 20px;
            /* 内邊距：設置的背景顔色會填充内邊距區域*/
            padding: 20px;
            /* 邊框：設置的背景顔色會填充内邊距區域 */
            border: 10px solid;
            /* 外邊距：只會影響盒子的位置，不會影響大小 */
            margin: 50px;

            /* 盒子的大小：
            content(内容區)+左右padding +左右border      */
            background-color: gray;
        }
    </style>
</head>
<body>
    <div>你好啊</div>
</body>
</html>
