<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04粘性定位</title>
    <!-- 參考點：
        離最近的一個擁有“滾動機制”的祖先元素，
        即使這個祖先不是最近的真實可滾動祖先 。

        真實可滾動祖先：
        就是說,content設置個設置滾動條overflow: scroll,
        但是其中的内容是剛好覆蓋的，所以沒有滑塊。也就被叫做不是最近的真實可滾動祖先。
    -->
    <style>
        * {
            /* 去掉元素的默認屬性 */
            margin: 0;
            padding: 0;
        }

        .page_header {
            height: 100px;
            background-color: orange;
            text-align: center;
            line-height: 100px;
        }
        .item {
            background-color: gray;
        }

        .first {
            background-color: skyblue;
            font-size: 40px;
            /* 設置粘性定位 */
            position: sticky;

            top :10px;

        }

        body {
            height: 6000px;
        }

        .content {
            /* overflow: scroll; */
        }
    </style>
</head>
<body>
    <div class="page_header">page_header</div>
    <!-- 内容區 -->
     <div class="content">
        <!-- 每一項 -->
         <div class="item">
            <div class="first">A</div>
            <h2>A1</h2>
            <h2>A2</h2>
            <h2>A3</h2>
            <h2>A4</h2>
            <h2>A5</h2>
            <h2>A6</h2>
            <h2>A7</h2>
            <h2>A8</h2>
            <h2>A9</h2>
            <div class="first">B</div>
            <h2>B1</h2>
            <h2>B2</h2>
            <h2>B3</h2>
            <h2>B4</h2>
            <h2>B5</h2>
            <h2>B6</h2>
            <h2>B7</h2>
            <h2>B8</h2>
            <h2>B9</h2>
            <div class="first">C</div>
            <h2>C1</h2>
            <h2>C2</h2>
            <h2>C3</h2>
            <h2>C4</h2>
            <h2>C5</h2>
            <h2>C6</h2>
            <h2>C7</h2>
            <h2>C8</h2>
            <h2>C9</h2>
         </div>
     </div>
</body>
</html>
