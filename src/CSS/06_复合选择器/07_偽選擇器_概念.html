<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偽選擇器——概念</title>

    <style>
        /* 僞類： 很像類，但不是類，是元素特殊存在的狀態的描述 */

        /* 選中的是沒有訪問的a元素，就是每點擊的顔色 */
        a:link {
            color: gold;
        }
        /* 選中的是訪問過的a元素，就是點擊了的顔色 */
        a:visited {
            color: gray;
        }
    </style>
</head>
<body>
    <a href="http://www.baidu.com">去百度</a>
    <a href="http://www.jd.com"">去京東</a>
    <a href="http://www.toutiao.com"">頭條參照</a>
</body>
</html>
