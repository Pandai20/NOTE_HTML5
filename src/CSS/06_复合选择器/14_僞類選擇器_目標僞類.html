<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目標僞類</title>
    <style>
        div {
            background-color: gray;
            height: 300px;
        }
        /* 選中錨點指定的元素 */
        div:target {
            background-color: green;
        }
    </style>
</head>
<body>
    <a href="#one">去看第1個</a>
    <br>
    <a href="#two">去看第2個</a>
    <br>
    <a href="#three">去看第3個</a>
    <br>
    <a href="#four">去看第4個</a>
    <br>
    <a href="#five">去看第5個</a>
    <br>
    <a href="#siz">去看第6個</a>
    <br>
    <a href="#seven">去看第7個</a>
    <br>
    <a href="#eight">去看第8個</a>
    <br>
    <div id="one">第1個</div> 
    <hr>
    <div id="two">第2個</div> 
    <hr>
    <div id="three">第3個</div> 
    <hr>
    <div id="four">第4個</div> 
    <hr>
    <div id="five">第5個</div> 
    <hr>
    <div id="siz">第6個</div> 
    <hr>
    <div id="seven">第7個</div> 
    <hr>
    <div id="eight">第8個</div> 
</body>
</html>
