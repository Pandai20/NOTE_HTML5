<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32_2D_變化原點</title>
    <style>
        .outer {
            width: 200px;
            height: 200px;
            border: 1px solid black;
            margin: 0 auto;
            margin-top: 80px;
            /* 元素想開啓3D變化，父元素必須要開啓3D空間 */
            
            /* 1.開啓3D空間  flat:2D(默認) preserve-3d*/
            transform-style: preserve-3d;
            /* 2.設置景深(有了透視效果，遠大近小) none-不指定
            ：指定觀察者與Z=0平面的距離，能讓發生3D變化的元素，產生透視效果，看起來更加立體
            */
            perspective: 450px;
        }

        .inner {
            width: 200px;
            height: 200px;
            background-color: skyblue;

            /* 圍繞X軸變化 */
            /* transform: rotateX(30deg); */
            /* 圍繞Y軸變化 */
            transform: rotateY(30deg);
            
        }  

    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
          你好啊
        </div>
    </div>

</body>
</html>
