<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>62_項目的排序和單獨的對齊</title>
    <style>
        .outer {
            width: 700px;
            height: 900px;
            background-color: #888;
            /* 设置为伸缩容器(开启了flex布局)，但是本质上还是div*/
            display: flex;

            /*主軸方向 */
            flex-direction: row;

            /*不能設置主軸換行 */
            /* flex-wrap: wrap; */
            
            /* 主軸對齊方式，起始位置 */
            justify-content: flex-start;

            
        }
        .inner {
            width: 200px;
            height: 200px;
            background-color: skyblue;
            /*border 和box-sizing 會影響收縮的大小的，計算的時候去掉*/
            border: 1px solid black;
            box-sizing: border-box;

            /*可以拉伸 壓縮 基準長度0  簡寫 flex:1; */
            flex: 1 1 0;

        }

       
        .inner2 {
            width: 300px;
            /* 1. 設置排序，默認排序的值都是0, 小的值會在前面*/
            order: -1;

        }

        /*2.設置單獨對齊  瞭解即可*/
        .inner1 {
            align-self: flex-end;
        }

     
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner inner1">1</div>
        <div class="inner inner2">2</div>
        <div class="inner inner3">3</div>
    </div>

</body>
</html>
