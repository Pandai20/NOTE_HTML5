<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13_文本_text_shadow</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            font-size: 20px;
            border: 1px solid black;

            /* 按照原文顯示 */
            white-space: pre;
            /* 超出換行 */
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div>
        數天下英雄
        還看今朝
        數天下英雄數天下英雄數天下英雄數天下英雄
        還看今朝
    </div>
</body>
</html>
