<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32_2D_變化原點</title>
    <style>
        .outer {
            width: 200px;
            height: 200px;
            border: 1px solid black;
            margin: 0 auto;
            margin-top: 80px;
        }

        .inner {
            width: 200px;
            height: 200px;
            background-color: skyblue;
            
            /* 設置原點的位置 */
            /* transform-origin: right top; */

            /* 通過具體的像素位置調整原點 */
            /* transform-origin: 50px 50px; */

            /* 通過百分比寫的 */
            /* transform-origin: 25% 25%; */

            /* 如果只寫一個，另外一邊就是對應的中心位置，50%*/
            transform-origin: left;


            transform: rotate(20deg);
        }  
        .test {
            width: 50px;
            height: 50px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <!-- 這裏寫的是用來觀察 原點的位置 -->
            <div class="test"></div>
        </div>
    </div>

</body>
</html>
