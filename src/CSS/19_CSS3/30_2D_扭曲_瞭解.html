<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29_2D_旋轉</title>
    <style>
        .outer {
            width: 200px;
            height: 200px;
            border: 1px solid black;
            margin: 0 auto;
            margin-top: 80px;
        }

        .inner {
            width: 200px;
            height: 200px;
            background-color: skyblue;

            /* x方向的 */
            /* transform: skewX(0deg); */
            /* y方向的 */
            /* transform: skewY(-2deg); */
            /* 兩個方向的，一個值默認X方向的*/
            transform: skew(30deg);
        }


    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">你好啊</div>
    </div>

</body>
</html>
