<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>44_動畫_其他使用</title>
    <style>

        .outer {
            width: 1300px;
            height: 100px;
            border: 1px solid black;

        }

        .inner {
            width: 100px;
            height: 100px;
            background-color: orange;

            /* 複合屬性的順序
            animation-name
            animation-duration
            animation-delay
            animation-timing-function
            animation-iteration-count
            animation-direction
            animation-fill-mode
            
            animation-play-state 暫停一般單獨使用
            */
            animation: removeToLeft 3s linear 2 alternate-reverse forwards;
            
        }
        
        /* 簡單的定義一個動畫   --第一種方式*/
        @keyframes removeToLeft {
            from {

            }

            to {
                transform: translateX(1200px) rotate(360deg);
                /* 這個時候發現 過程中是終端的
                需要更改瀏覽器設置：硬件加速
                或者添加動畫延時時間
                */
                background-color: purple;
                /*設置圓角*/
                border-radius: 50%;
            }
        }

    </style>
</head>
<body>
    <div class="outer">
        <div class="inner"></div>
    </div>
</body>
</html>
