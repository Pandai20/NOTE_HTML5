<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20_web字體</title>
    <style>
        /* 這種方式不適用于綫上項目，最好的方式是對指定文字定制字體*/
        @font-face {
            font-family: "ZCOOLKuaiLe";
            src: url('../../font/ZCOOLKuaiLe-Regular.ttf');
        }
        h1 {
            font-size: 50px;
            font-family: 'ZCOOLKuaiLe';
        }
    </style>
</head>
<body>
    <h1>春風得意馬蹄疾，不信人間有別離</h1>
</body>
</html>
