<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18_徑向漸變</title>

    <style>
        .box {
            width: 300px;
            height: 200px;
            border: 1px solid black;
            float: left;
            margin-left: 50px;
            margin-bottom: 50px;
            font-size: 20px;
        }
        .box1 {
            background-image: radial-gradient(red,yellow,green);
        }
        .box2 {
            /* 設置圓心左上角 */
            background-image: radial-gradient(at left top, red ,yellow,green);
        }
        .box3 {
            /* 通過像素值調整圓心 */
            background-image: radial-gradient(at 100px 50px, red ,yellow,green);
        }
        .box4 {
            /* 通過circle調整為正圓 */
            background-image: radial-gradient(circle, red ,yellow,green);
        }

        .box5 {
            /* 通過像素值調整為正圓 */
            background-image: radial-gradient(100px 200px, red ,yellow,green);
            
        }
        .box6 {
            /* 調整徑向漸變的區域 */
            background-image: radial-gradient(red 50px,yellow 100px,green 150px);
        }

        .box7 {
            /* 綜合寫法
            100px 50px : 圓心半徑
            150px 150px ：圓心位置
            */
            background-image: radial-gradient(100px 50px at 150px 150px,red 50px,yellow 100px,green 150px);
        }
        
    </style>
</head>
<body>
    <div class="box box1">默認</div>
    <div class="box box2">通過關鍵詞調整圓心</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
    <div class="box box5">5</div>
    <div class="box box6">6</div>
    <div class="box box7">7</div>
</body>
</html>
