<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>57_伸縮盒模型_垂直居中</title>
    <style>
        .outer {
            width: 400px;
            height: 400px;
            background-color: skyblue;
            display: flex;
            /* 第二種方式 */
            /* 設置主軸、側軸中間對齊， */
            justify-content: center;
            align-items: center;
        }
        .inner {
            width: 100px;
            height: 100px;
            background-color: gray;
            /* 第一種方式,要設置父元素為伸縮容器*/
            /* margin: auto; */
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner"></div>
    </div>
</body>
</html>
