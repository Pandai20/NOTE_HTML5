<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01文本顔色</title>
    <style>
        div {
            font-size: 20px;
        }
        .front1 {
            /* 字母間距  包括漢字 */
            letter-spacing: 20px;
        }
        .front3 {
            /* 單詞間距  不包括漢字 通過空格識別單詞*/
            word-spacing: 20px;
        }

    </style>
</head>
<body>
    <div class="front1">Lorem ipsum dolor sit,我是間距.</div>
    <div class="front2">Lorem ipsum dolor sit,我是間距.</div>
    <div class="front3">Lorem ipsum dolor sit,我是間距.</div>
</body>
</html>
