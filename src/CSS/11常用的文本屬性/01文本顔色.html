<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01文本顔色</title>
    <style>
        div {
            font-size: 100px;
        }
        .front {
            color: red;
        }
        .front1 {
            color: rgb(255, 0, 0);
        }
        .front2 {
            color: rgba(255, 0, 0, 0.5);
        }
        .front3 {
            color: #0000ff;
            /* 簡寫 ：#00f */
        }
        .front4 {
            color: #0000ff88;
            /* 簡寫 ：#00f8 */
        }
        .front5 {
            color: hsl(0, 100%, 50%);
        }
        .front6 {
            color: hsla(0, 100%, 50%, 0.48);
        }

    </style>
</head>
<body>
    <div class="front">我學習前端三件套</div>
    <div class="front1">我學習前端三件套1</div>
    <div class="front2">我學習前端三件套2</div>
    <div class="front3">我學習前端三件套3</div>
    <div class="front4">我學習前端三件套4</div>
    <div class="front5">我學習前端三件套5</div>
    <div class="front6">我學習前端三件套6</div>
</body>
</html>
