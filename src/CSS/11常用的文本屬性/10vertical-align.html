<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10vertical-align</title>
    <!-- 垂直 排列 -->
     <style>
        div {
            font-size: 50px;
            background-color: skyblue;
            /* height:指的是元素的整體高度 */
            height: 100px;
        }

        .show_baseline {
            font-size: 20px;
            background-color: orange;
            vertical-align: middle;
        }
     </style>
</head>
<body>

        ggboy學習前端三件套x<span class="show_baseline">x學習</span>
