<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>12基本包装类型</title>
        <script>
            // 就是把简单数据类型包装为复杂的数据类型，
            // 就能使用js提供的函数了
            console.log("=========1.String==========");
            // 1.基本包装类型
            var str = "candy";
            // 包装为复杂类型
            var name = new String("jack");
            // 把临时变量的值赋值给str
            str = name;
            // 销毁的这个临时变量
            temp = null;
            console.log("   object :>> ", name);

            console.log("=========2.字符串的操作方法==========");
            // 1.字符串拼接  一般使用+直接
            var str1 = "andy";
            var str2 = "jock";
            var str3 = str1.concat(str2);
            console.log("   str3 :>> ", str3);

            // 2.截取字符串
            var str4 = "改革春风吹满地";
            // 第一个参数 ：索引  第二个参数：取得个数
            console.log("   object :>> ", str4.substr(2, 2));

            // 3，替换字符串,只会替换第一个
            var str5 = "anadya";
            console.log("   这里是返回的字符串 :>> ", str5.replace("a", "66"));
            console.log("   str5原来的字符串没有改变 :>> ", str5);
            // 重复替换
            while (str5.indexOf("a") != -1) {
                // 注意这里字符串需要重新赋值，因为是创建的一个新的字符串出来的
                str5 = str5.replace("a", "66");
            }
            console.log("   重复替换 :>> ", str5);

            // 4，字符串转换为数组
            var str2 = "red,blue,black";
            console.log("   字符串转换为数组 :>> ", str2.split(","));

            console.log("=========3.简单类型  值类型==========");
            /* 简单数据类型 ：string number boolean undefined null */
            var timer = null;
            console.log("   null :>> ", typeof timer); //返回的是一个空的对象

            /* 复杂数据类型  数组 */

            console.log("=========3.简单类型和复杂类型传参==========");
            // 简单类型传参   就相当于形参是拷贝  实参不会变
            // 复杂类型传参   就相当于指针        实参会改变
        </script>
    </head>
    <body></body>
</html>
