<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05运算符</title>
    <script>
        /* ===================算数运算符========================= */
        console.log('1.算数运算符 ================start ');
        //1.取余
        console.log('   取余 :>> ', 4 % 2);
        //2.除法
        console.log('   除法 :>> ', 4/3);

        // 3.浮点数 算数运算会有问题(尽量不适用 后面会解决)
        console.log('   0.1 + 0.2 :>> ', 0.1 + 0.2);
            //不能直接拿浮点数是不是相等
        var number_f = 0.1 + 0.2;
        console.log('   number_f == 0.3 ？？ :>> ', number_f == 0.3);


        /* ===================前置递增运算符========================= */
        console.log('2.前置递增运算符 ================start ');
        var num_plus = 1;
        // 1.先自加1，后返回值
        console.log('   前置递增 ++num_plus :>> ', ++num_plus);        

        /* ===================后置递增运算符========================= */
        console.log('3.后置递增运算符 ================start ');
        var plus_num = 1;
        // 1.先返回值，后自加
        console.log('   后置递增 plus_num++ :>> ', plus_num++);
        console.log('   plus_num最后结果 :>> ', plus_num);   


        /* ===================比较运算符========================= */
        console.log('4.比较运算符 ================start ');
        /*大于等于 >= ，小于等于 <= ， 等于 ==  ，不等于 != ，
        === 全等于，要求值和类型都得一致
        */
        // 1.==默认转换类型，只要求字符串和数字的值是相等的
        console.log('  18 == "18" 结果 :>> ', 18 == '18');
        // 2.全等
        console.log('  18 === "18" 结果 :>> ', 18 === '18');


        /* ===================逻辑运算符========================= */
        console.log('5.逻辑运算符 ================start ');
        /*  与 && 
            或 ||
            非 !
        */
        
        /* ===================赋值运算符========================= */
        console.log('6.赋值运算符 ================start ');
        /*  加减乘除 取余以后再赋值
            +=、-=、*=、/=、%=
        */


         /* ===================运算符优先级问题========================= */
        console.log('7.运算符优先级问题 ================start ');
        // 1. 先算 && 然后算 ||
