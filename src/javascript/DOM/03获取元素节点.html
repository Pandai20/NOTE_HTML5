<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>03获取元素节点</title>
    </head>
    <body>
        <div class="outer">
            <div class="left_top">
                <div>你喜欢哪个城市</div>
                <ul class="city">
                    <li>北京</li>
                    <li>上海</li>
                    <li>东京</li>
                    <li>首尔</li>
                </ul>
                <div>你喜欢哪款单机游戏</div>
                <ul class="game">
                    <li>红警</li>
                    <li>实况</li>
                    <li>极品飞车</li>
                    <li>魔兽</li>
                </ul>
                <div>你手机的操作系统</div>
                <ul class="operator">
                    <li>IOS</li>
                    <li>Android</li>
                    <li>Windows phone</li>
                </ul>
            </div>
            <input type="radio" name="gender" value="male" class="男" />
            Male
            <input type="radio" name="gender" value="female" class="女" />
            Female
        </div>
        <!-- 写在下面是因为要等页面加载完成 -->
        <script>
            /* 1.通过标签名称获取一组元素节点对象 
                即使只有一个元素也会封装在一个数组中
            */
            var objsByTagName = document.getElementsByTagName("li");
            console.log("1.获取到的元素对象是 :>> ", objsByTagName);
            console.log("1.获取到的元素个数是:>> ", objsByTagName.length);
            // 1.1 打印列表中的文字，遍历lis
            for (let index = 0; index < objsByTagName.length; index++) {
                const element = objsByTagName[index].innerHTML;
                console.log("   一组元素节点对象中的文字 :>> ", element);
            }

            /* 2.通过Name获取一组元素节点对象  */
            var objsByName = document.getElementsByName("gender");
            console.log("2.获取到的元素对象是 :>> ", objsByName);
            console.log("2.获取到的元素个数是:>> ", objsByName.length);
            // 2.1 打印列表中的文字，遍历lis
            for (let index = 0; index < objsByName.length; index++) {
                /* 对于单标签，这里获取innerHTML没有意义 */
                // const element = objsByName[index].innerHTML;

                console.log(
                    "   index ",
                    index,
                    " 中值是:>> ",
                    objsByName[index].name
                );
                console.log(
                    "   index ",
                    index,
                    " 中值是:>> ",
                    objsByName[index].value
                );
                // 这里要注意这里不是直接class,而是className
                console.log(
                    "   index ",
                    index,
                    " 中值是:>> ",
                    objsByName[index].className
                );
            }
        </script>
    </body>
</html>
