<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13外邊距注意事項5_margin</title>
    <style>
       .id1 {
          width: 400px;
          height: 400px;
          font-size: 30px;
          background-color: skyblue;
       }
       .id2 {
          width: 400px;
          height: 400px;
          font-size: 30px;
          background-color: gold;

          /* margin: 也可以為負值 */
          margin-top: -150px;
       }

    </style>

</head>
<body>
   
    <div class="id1">我是一個塊元素</div>
    <div class="id2">我是一段文字</div>
</body>
</html>
