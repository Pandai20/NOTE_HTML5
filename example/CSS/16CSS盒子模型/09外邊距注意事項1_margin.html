<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09外邊距注意事項1_margin</title>
    <style>
        .outer {
            width: 400px;
            height: 400px;
            background-color: gray;
            padding: 50px;
        }
        .inner {
            width: 100px;
            height: 100px;
            background-color: orange;

            margin: 100px;
        }
    </style>

</head>
<body>
    <!-- 子元素的margin是參考父元素的content計算的-->
    <div class="outer">
        <div class="inner"></div>
    </div>
</body>
</html>
