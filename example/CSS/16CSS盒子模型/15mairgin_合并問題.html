<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15mairgin_合并問題</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
        }
        .box1 {
            background-color: gray;
            margin-bottom: 50px;
        }
        /* 1.box1下和box2上的外邊距會合并，
        取得是其中的最大的外邊距的值。
        無需解決，把想要的外邊距設置到指定一個的box中就行了。

        */
        .box2 {
            background-color: skyblue;
            margin-top: 50px;
        }
        
        /* 
        2.左右邊距是正常的 */
        .box3 {
            background-color: gold;
            margin-right: 50px;
            display: inline-block;
        }
        .box4 {
            background-color: green;
            margin-left: 50px;
            display: inline-block;
        }

    </style>
</head>
<body>
    <div class="box box1">1</div>
    <div class="box box2">2</div>

    <hr>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
</body>
</html>
