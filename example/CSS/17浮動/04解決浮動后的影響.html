<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04解決浮動后的影響</title>
    <style>
        /* 浮動后會產生的影響：
        ①.對兄弟元素的影響：後面的兄弟元素（盒子4-塊元素且不浮動）
            ，會占據浮動元素之前的位置（在盒子1後面了），
            在浮動元素的下面；對前面的兄弟無影響

        ②.對父元素的影響：（這個時候沒有盒子4）
            不能撐起父元素的高度坍塌；但是父元素的寬度依然束縛浮動的元素。
        */
        .outer {
            width: 500px;
            background-color: gray;
            border: 1px black solid;
            /* 方案1：給父元素指定高度 */
            /* height: 122px; */

            /* 方案2：給父元素設置浮動 */
            /* float: left; */

            /* 方案3：給父元素設置 */
            /* overflow: hidden; */

            /* 方案1\2\3無法消除浮動后對於兄弟元素的影響,
            所以: 在設置浮動的時候,兄弟元素要麽全部浮動,要麽全部不浮動!
            */
        }
        .box {
            width: 100px;
            height: 100px;
            font-size: 20px;
            background-color: skyblue;
            margin: 10px;
        }

        .box1,.box2,.box3 {
            float: left;
        }
        
        /* 方案4: 在所有浮動元素的最後面，添加一個塊級元素 ，
        并設置clear:both.
        clear :就是消除浮動會產生的影響
        
        .box4 {
            clear: both;
        }

        這裏有兩種方法,原理是相同的.
        */
        .outer::after {
            content: "";
            display: block;
            clear: both;
        }
        
    </style>
</head>
<body>
    <div class="outer">
        <div class="box box1">盒子1</div>
        <div class="box box2">盒子2</div>
        <div class="box box3">盒子3</div>
        <!-- <div class="box box4">盒子4</div> -->
    </div>
