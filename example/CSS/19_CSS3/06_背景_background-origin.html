<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06_背景_background-origin</title>
    <style>

        .box1 {
            width: 400px;
            height: 400px;
            background-color: skyblue;
            margin: 0 auto;
            font-size: 40px;
            padding: 50px;
            border: 50px dashed rgba(0, 0, 0, 0.781);

            background-image: url(../../dahuangmao-09.png);

           
            /* ①設置背景不重複 */
            /* background-repeat: no-repeat; */

             /* 1.默認的背景的起點是 padding的左上角 */
            /* ②設置起點的位置 */
            background-origin: border-box;
            background-origin: padding-box; 
            background-origin: content-box;
        }

    </style>
</head>
<body>
    <div class="box1">你好啊</div>
</body>
</html>
