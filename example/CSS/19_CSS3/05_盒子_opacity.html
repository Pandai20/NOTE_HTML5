<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05_盒子_opacity</title>
    <!-- 設置 不透明度 -->
    <style>
        .box1 {
            width: 400px;
            height: 400px;
            background-color: orange;
            margin: 0 auto;
            margin-top: 100px;
            font-size: 40px;
            /* 0-1 之間的小數，0：完全透明 */
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="box1">你好</div>
</body>
</html>
