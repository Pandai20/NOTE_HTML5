<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05文本對齊</title>
    <style>
        div {
            font-size: 20px;
        }
        .front1 {
            /* 默認是left對其 */
            text-align: left;
        }
        .front2 {
            /* 中間對其 */
            text-align: center;
        }
        .front3 {
            /* 右對齊 */
            text-align: right;
        }


    </style>
</head>
<body>
    <div class="front1">我學習前端三件套</div>
    <div class="front2">我學習前端三件套</div>
    <div class="front3">我學習前端三件套</div>
    
</body>
</html>
