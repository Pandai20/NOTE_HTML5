<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行高</title>
    <style>
        /* 正常的字是由下移的，不要把字體大小和行高 設置為相同的
        也就是line-height 和font-size 永遠不要相等
        line-height ：默認值 normal
        1.line-height: 100px;  像素寫法
        2.line-height: normal; 第二種寫法
        3.line-height: 1      第三種寫法數值，px值的1.5~2倍之間
        4.line-height: 100%  百分比寫法

        一般使用第三種寫法，數值寫法
        */
        #line_height {
            font-size: 40px;
            background-color: skyblue;
            line-height: 1.667;
        }
    </style>
</head>
<body>
    <div id="line_height">ggboy學習前端三件套ggboy學習前端三件套,ggboy學習前端三件套,ggboy學習前端三件套,ggboy學習前端三件套,ggboy學習前端三件套,ggboy學習前端三件套,ggboy學習前端三件套,</div>
</body>
</html>
