<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03字體風格_font-style</title>
    <style>

        .front {
            font-size: 100px;
            font-style: normal;
        }
        .front1 {
            font-size: 100px;
            /*italic 是字體設計師 設計的，沒找到的話會幫我們生成斜體的  */
            /* 一般用這個 */
            font-style: italic;
        }
        .front2 {
            font-size: 100px;
            /*oblique 是强制生成的斜體的  */
            font-style: oblique;
        }
    </style>
</head>
<body>
    <div class="front">我學習前端三件套</div>
    <div class="front1">我學習前端三件套1</div>
    <div class="front2">我學習前端三件套1</div>
</body>
</html>
