<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字體大小</title>

    <!-- 通常瀏覽器的默認字體大小不一樣，因此最好給一個
    明確的值，不要使用默認值 

    在body中明確指出font-size的大小，其他元素都能繼承了
    
    -->
    <style>
        .front {
            font-size: 40px;
        }
        .front1 {
            font-size: 30px;
        }
        .front2 {
            font-size: 20px;
        }
        /* 默認大小16px */
        .front3 {
            font-size: 16px;
        }
        /* .front4 {
            font-size: 3px;
        } */

        body {
            font-size: 60px;
        }
    </style>
</head>
<body>
    <div class="front">我學習前端三件套</div>
    <div class="front1">我學習前端三件套1</div>
    <div class="front2">我學習前端三件套2</div>
    <div class="front3">我學習前端三件套3</div>
    <div class="front4">我學習前端三件套4</div>
</body>
</html>
