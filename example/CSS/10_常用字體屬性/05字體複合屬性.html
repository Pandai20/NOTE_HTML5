<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05字體複合屬性</title>
    <style>
       /* font是字體的複合屬性 
       有順序要求：
                其他屬性 font-size "font-style","font-style1"
       中間使用空格隔開

       一般推薦使用複合屬性
       */
        .front {
           font: bold 100px "仿宋";
        }
       
    </style>
</head>
<body>
    <div class="front">我學習前端三件套</div>
    <div class="front1">我學習前端三件套1</div>
    <div class="front2">我學習前端三件套2</div>
    <div class="front3">我學習前端三件套3</div>
    <div class="front4">我學習前端三件套4</div>
</body>
</html>
