<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03固定定位</title>
    <!-- 固定元素大體和這個對決定位相同
    脫離文檔流
    1.參考對象：視口 
        就是上下滑動的時候，那塊頁面是不會動的
        overflow: scroll; 可以設置視口
    -->
    <style>
        .outer {
            width: 500px;
            background-color: skyblue;
            border: 1px solid black;

        }

        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .box1 {
            background-color: orange;
        }
        .box2 {
            background-color: gray;
            position: fixed;
            top: 0px;
            left: 0px;
        }

        .box3 {
            background-color: green;

        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
    </div>
</body>
