<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02絕對定位</title>
    <!-- 絕對定位：  `position`属性值设置为`absolute`时。
    1.開啓絕對定位以後，元素脫離文檔流。
    -->
    <style>
        .outer {
            width: 500px;
            background-color: skyblue;
            border: 1px solid black;
            /* position: absolute; */
        }

        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .box1 {
            background-color: orange;
        }
        /* 絕對定位的參考點在哪裏？---包含塊
        什麽是包含塊？
            1.對於沒有脫離文檔流的元素：包含塊就是父元素
            2.對於脫離文檔流的元素：包含塊是第一個擁有定位屬性的祖先元素。
                （如果所有祖先都沒定位，那包含塊就是整個頁面，即html（根元素、初始包含块）

            3.無論是什麽元素（行内、行内塊、快級）設置為絕對定位后，
            都變成了定位元素。
                定位元素：默認寬高都被内容撐開，能自由設置寬高。
        */
        .box2 {
            background-color: gray;
            position: absolute;
            /* 距離左邊，0像素 */
            left: 0px;
            top: 0px;
          
        }

        .box3 {
            background-color: green;
        }
        span {
            background-color: gold;
            border: 1px solid black;
            width: 100px;
            height: 100px;
            position: absolute;
            left: 100px;
            top: 0px;

        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
        <span>123</span>
    </div>
</body>
</html>
